spring.application.name=angular-dashboard-backend
server.port=8080

# --- Microsoft SQL Server (local SQLEXPRESS instance, Windows Authentication) ---
# integratedSecurity=true needs the native mssql-jdbc_auth DLL under ./lib on
# java.library.path (already wired into the Maven run/package config) — see README.
spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=angular_dashboard;integratedSecurity=true;encrypt=false;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# ddl-auto=update is fine for local development only — see README for why this
# must NOT be used against a production database.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# A request body field Angular sends that a DTO doesn't declare (e.g. login's
# `rememberMe`) should be ignored rather than rejected.
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- JWT ---
# Development-only default secret. Override via the JWT_SECRET env var for
# anything beyond local development — never commit a real secret here.
app.jwt.secret=${JWT_SECRET:dev-only-secret-2f8a9c7e1b6d4f3a9082c5e7b1a4d6f8c3b5a7e9d1f2c4b6a8e0d2f4c6b8a0e2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
